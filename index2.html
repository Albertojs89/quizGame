<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flan de Coco Lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }

  /* ---------- Loader ---------- */
  #fdc-loader {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: transparent;
    transition: opacity .6s ease, visibility .6s ease;
  }
  #fdc-loader.is-done { opacity: 0; visibility: hidden; }

  #fdc-loader svg {
    width: min(56vw, 78vh * 1.2);
    max-width: 900px;
    overflow: visible;
  }

  /* Grupo completo: arranca levemente girado y se endereza */
  .fdc-group {
    transform-box: view-box;
    transform-origin: 50% 50%;
    animation: fdc-settle .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes fdc-settle {
    from { transform: translateY(-3%) rotate(-4deg) scale(.96); }
    to   { transform: none; }
  }

  /* Cada letra: aparece desde abajo con un pequeño rebote */
  .fdc-letter {
    transform-box: view-box; /* el origen se fija por letra desde JS */
    opacity: 0;
    animation: fdc-letter .42s cubic-bezier(.25,.9,.3,1) both;
    animation-delay: calc(var(--i) * 70ms);
  }
  @keyframes fdc-letter {
    0%   { opacity: 0;  transform: translateY(14%) rotate(var(--r)) scale(.7); }
    35%  { opacity: .9; }
    60%  { opacity: 1;  transform: translateY(-3%) rotate(calc(var(--r) * -.5)) scale(1.08); }
    80%  {              transform: translateY(1%) scale(.97); }
    100% { opacity: 1;  transform: none; }
  }

  /* Globo de diálogo: crece desde la punta con overshoot */
  .fdc-bubble {
    transform-box: view-box;
    transform-origin: 1200px 757px; /* punta del globo */
    opacity: 0;
    animation: fdc-bubble .55s cubic-bezier(.3,1.4,.5,1) 1.0s both;
  }
  @keyframes fdc-bubble {
    0%   { opacity: 0; transform: scale(.12, .04); }
    20%  { opacity: 1; }
    45%  {             transform: scale(.75, .6); }
    75%  {             transform: scale(1.05); }
    100% { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fdc-group, .fdc-letter, .fdc-bubble { animation: none; opacity: 1; }
  }

  /* ---------- Demo de página ---------- */
  main { padding: 48px 16px; max-width: 720px; margin: 0 auto; }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: #2191cf; color: #fff; cursor: pointer; }
</style>
</head>

<script>
(() => {
  // Recortes de cada pieza en coordenadas del logo original (2000×1663): [x0, x1, y0, y1]
  const LETTERS = [
    [0, 237, 347, 748], [271, 503, 347, 748], [517, 841, 347, 748], [858, 1140, 347, 748],          // F L A N
    [0, 278, 796, 1211], [323, 565, 796, 1211], [593, 868, 796, 1211],
    [895, 1181, 796, 1211], [1208, 1483, 796, 1211], [1510, 1796, 796, 1211],                       // D E C O C O
    [0, 233, 1261, 1662], [244, 568, 1261, 1662], [590, 869, 1261, 1662],                           // L A B
  ];
  const BUBBLE = [1193, 1999, 0, 757];
  const PAD = 4;
  const HOLD_MS = 2600;   // tiempo mínimo visible (la animación dura ~1.6 s)

  const NS = 'http://www.w3.org/2000/svg';
  const loader = document.getElementById('fdc-loader');
  const svg = loader.querySelector('svg');
  const group = svg.querySelector('.fdc-group');
  const defs = svg.querySelector('defs');

  function piece([x0, x1, y0, y1], id, cls) {
    const clip = document.createElementNS(NS, 'clipPath');
    clip.id = id;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', x0 - PAD);
    rect.setAttribute('y', y0 - PAD);
    rect.setAttribute('width', x1 - x0 + PAD * 2);
    rect.setAttribute('height', y1 - y0 + PAD * 2);
    clip.appendChild(rect);
    defs.appendChild(clip);

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', cls);
    const use = document.createElementNS(NS, 'use');
    use.setAttribute('href', '#fdc-src');
    use.setAttribute('clip-path', `url(#${id})`);
    g.appendChild(use);
    group.appendChild(g);
    return g;
  }

  LETTERS.forEach((box, i) => {
    const g = piece(box, `fdc-l${i}`, 'fdc-letter');
    g.style.transformOrigin = `${(box[0] + box[1]) / 2}px ${box[3]}px`;
    g.style.setProperty('--i', i + 2);
    g.style.setProperty('--r', `${(Math.random() * 10 - 5).toFixed(1)}deg`);
  });
  piece(BUBBLE, 'fdc-b', 'fdc-bubble');

  // Reinicia todas las animaciones CSS del loader
  function play() {
    loader.classList.remove('is-done');
    svg.querySelectorAll('.fdc-group, .fdc-letter, .fdc-bubble').forEach(el => {
      el.style.animation = 'none';
      el.getBoundingClientRect();
      el.style.animation = '';
    });
  }

  function hideWhenReady() {
    const minTime = new Promise(r => setTimeout(r, HOLD_MS));
    const pageLoaded = document.readyState === 'complete'
      ? Promise.resolve()
      : new Promise(r => window.addEventListener('load', r, { once: true }));
    Promise.all([minTime, pageLoaded]).then(() => loader.classList.add('is-done'));
  }

  hideWhenReady();

  document.getElementById('replay').addEventListener('click', () => {
    play();
    hideWhenReady();
  });
})();
</script>
