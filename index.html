<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Wiki / Glosario alfabético</title>
  <!-- Enlazamos el CSS externo -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wiki-container">
    <!-- Título opcional -->
    <h1 class="wiki-title"></h1>

    <!-- =====================
         NAVEGACIÓN ALFABETO
         ===================== -->
    <section class="alphabet-nav">
      <!-- Flecha izquierda -->
      <button class="alphabet-arrow alphabet-arrow--left" aria-label="Anterior letra">
        &#10094;
      </button>

      <!-- Contenedor que hace scroll horizontal -->
      <div class="alphabet-scroll" aria-label="Navegación por letras">
        <div class="alphabet-list">
          <!--
            Cada letra se representa como un botón.
            data-letter indica qué letra es.
            Puedes añadir más letras fácilmente.
          -->
          <button class="alphabet-letter alphabet-letter--active" data-letter="A">A</button>
          <button class="alphabet-letter" data-letter="B">B</button>
          <button class="alphabet-letter" data-letter="C">C</button>
          <button class="alphabet-letter" data-letter="D">D</button>
          <button class="alphabet-letter" data-letter="E">E</button>
          <button class="alphabet-letter" data-letter="F">F</button>
          <button class="alphabet-letter" data-letter="G">G</button>
          <button class="alphabet-letter" data-letter="H">H</button>
          <button class="alphabet-letter" data-letter="I">I</button>
          <button class="alphabet-letter" data-letter="J">J</button>
          <button class="alphabet-letter" data-letter="K">K</button>
          <button class="alphabet-letter" data-letter="L">L</button>
          <button class="alphabet-letter" data-letter="M">M</button>
          <button class="alphabet-letter" data-letter="N">N</button>
          <button class="alphabet-letter" data-letter="O">O</button>
          <button class="alphabet-letter" data-letter="P">P</button>
          <button class="alphabet-letter" data-letter="Q">Q</button>
          <button class="alphabet-letter" data-letter="R">R</button>
          <button class="alphabet-letter" data-letter="S">S</button>
          <button class="alphabet-letter" data-letter="T">T</button>
          <button class="alphabet-letter" data-letter="U">U</button>
          <button class="alphabet-letter" data-letter="V">V</button>
          <button class="alphabet-letter" data-letter="W">W</button>
          <button class="alphabet-letter" data-letter="X">X</button>
          <button class="alphabet-letter" data-letter="Y">Y</button>
          <button class="alphabet-letter" data-letter="Z">Z</button>
        </div>
      </div>

      <!-- Flecha derecha -->
      <button class="alphabet-arrow alphabet-arrow--right" aria-label="Siguiente letra">
        &#10095;
      </button>
    </section>

    <!-- =====================
         PANEL DE TÉRMINOS
         ===================== -->
    <section class="terms-panel">
      <!-- Letra seleccionada -->
      <h2 class="terms-letter" id="termsLetter">A</h2>

      <!-- Contenedor de lista de palabras -->
      <ul class="terms-list" id="termsList">
        <!-- Los términos se inyectan por JavaScript -->
      </ul>

      <!-- Mensaje cuando no hay términos para esa letra -->
      <p class="terms-empty-message" id="emptyMessage" hidden>
        Todavía no hay términos para esta letra.
      </p>
    </section>
  </main>

  <!-- =====================
       JAVASCRIPT
       ===================== -->
  <script>
    // ==========
    // DATOS BASE
    // ==========
    
    const glossary = {
      A: [
        {
          term: "Alucinaje",
          description: "Persona que alucina pepina."
        },
        {
          term: "Almohada",
          description: "Objeto mullido ideal para dormir la siesta perfecta."
        },
        {
          term: "Amigo",
          description: "Ser humano (o perrete) imprescindible para compartir memes."
        },
        {
          term: "Alcachofa",
          description: "Verdura infravalorada pero muy top al horno."
        },
        {
          term: "Aguacate",
          description: "Fruta cremosa que hace que todo lo que toque sea más delicioso."
        },
        {
          term: "Anfitrión",
          description: "Persona que recibe invitados y se asegura de que estén cómodos."
        },
        {
          term: "Amanecer",
          description: "Momento del día en que el sol se levanta y todo parece posible."
        },
        {
          term: "Aventura",
          description: "Experiencia emocionante que saca lo mejor de ti."
        },
        {
          term: "Arcoíris",
          description: "Fenómeno óptico que llena el cielo de colores y esperanza."
        }
        
      ],
      B: [
        {
          term: "Banner",
          description: "Elemento gráfico que ocupa media pantalla y nadie mira pero todos clican sin querer."
        },
        {
          term: "Breakpoint",
          description: "Ese punto mágico en el que la web se rompe en móvil."
        }
      ],
      C: [
        {
          term: "Component",
          description: "Pieza reutilizable de UI que juras no tocar más… hasta el siguiente refactor."
        }
      ]
      // Puedes seguir añadiendo letras: D: [...], E: [...], etc.
    };

    // ==========================
    // REFERENCIAS A ELEMENTOS DOM
    // ==========================
    const alphabetScroll = document.querySelector(".alphabet-scroll");
    const alphabetLetters = document.querySelectorAll(".alphabet-letter");
    const arrowLeft = document.querySelector(".alphabet-arrow--left");
    const arrowRight = document.querySelector(".alphabet-arrow--right");

    const termsLetter = document.getElementById("termsLetter");
    const termsList = document.getElementById("termsList");
    const emptyMessage = document.getElementById("emptyMessage");

    // Guardamos la letra actualmente seleccionada
    let currentLetter = "A";

    // ======================
    // FUNCIONES PRINCIPALES
    // ======================

    /**
     * Marca visualmente una letra como activa (más grande, subrayada)
     * y actualiza la variable currentLetter.
     */
    function setActiveLetter(letterButton) {
      // Quitamos la clase activa de todas las letras
      alphabetLetters.forEach(btn =>
        btn.classList.remove("alphabet-letter--active")
      );

      // Marcamos esta como activa
      letterButton.classList.add("alphabet-letter--active");

      // Actualizamos la letra actual
      currentLetter = letterButton.dataset.letter;

      // Actualizamos el título de la sección de términos
      termsLetter.textContent = currentLetter;

      // Hacemos que la letra seleccionada quede centrada lo máximo posible
      letterButton.scrollIntoView({
        behavior: "smooth",
        inline: "center",
        block: "nearest"
      });
    }

    /**
     * Pinta en pantalla la lista de términos para la letra actual.
     * Si no hay términos, muestra un mensaje.
     */
    function renderTermsForCurrentLetter() {
      const terms = glossary[currentLetter] || [];

      // Limpiamos la lista anterior
      termsList.innerHTML = "";

      if (!terms.length) {
        // No hay términos: mostramos mensaje
        emptyMessage.hidden = false;
        return;
      }

      // Sí hay términos: ocultamos mensaje
      emptyMessage.hidden = true;

      // Creamos cada item de la lista
      terms.forEach(termObj => {
        const li = document.createElement("li");
        li.className = "term-item";

        // Botón con el nombre de la palabra
        const button = document.createElement("button");
        button.className = "term-title";
        button.type = "button";
        button.textContent = termObj.term;

        // Descripción que se desplegará
        const desc = document.createElement("p");
        desc.className = "term-description";
        desc.textContent = termObj.description;

        li.appendChild(button);
        li.appendChild(desc);
        termsList.appendChild(li);
      });
    }

    /**
     * Maneja el clic en una letra del abecedario.
     */
    function handleLetterClick(event) {
      const button = event.target.closest(".alphabet-letter");
      if (!button) return;

      setActiveLetter(button);
      renderTermsForCurrentLetter();
    }

    /**
     * Maneja el clic en una palabra del listado para desplegar/ocultar
     * su descripción con una animación suave.
     */
    function handleTermClick(event) {
      const titleButton = event.target.closest(".term-title");
      if (!titleButton) return;

      const item = titleButton.parentElement;

      // UNA descripción abierta a la vez,
      
      
      document
        .querySelectorAll(".term-item--open")
        .forEach(openItem => {
          if (openItem !== item) {
            openItem.classList.remove("term-item--open");
          }
        });
      

      // Alternamos el estado abierto/cerrado
      item.classList.toggle("term-item--open");
    }

    /**
     * Desplaza suavemente el scroll horizontal del abecedario cuando
     * se pulsan las flechas laterales.
     */
    function scrollAlphabet(direction) {
      const amount = 200; // píxeles a desplazar cada vez
      const delta = direction === "left" ? -amount : amount;

      alphabetScroll.scrollBy({
        left: delta,
        behavior: "smooth"
      });
    }

    // ======================
    // LISTENERS / EVENTOS
    // ======================

    // Clic en letras
    document
      .querySelector(".alphabet-list")
      .addEventListener("click", handleLetterClick);

    // Clic en palabras (desplegar descripción)
    termsList.addEventListener("click", handleTermClick);

    // Flechas izquierda/derecha
    arrowLeft.addEventListener("click", () => scrollAlphabet("left"));
    arrowRight.addEventListener("click", () => scrollAlphabet("right"));

    // ======================
    // INICIALIZACIÓN
    // ======================

    // Al cargar la página, marcamos la letra A como activa
    // y pintamos sus términos (si existen).
    renderTermsForCurrentLetter();
  </script>
</body>
</html>
